name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown-reader:
    uses: ./.github/workflows/markdown-reader.yml

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            python-version: '3.9'
          - runner: ubuntu-latest
            python-version: '3.10'
          - runner: ubuntu-latest
            python-version: '3.14'
          - runner: windows-latest
            python-version: '3.9'
          - runner: windows-latest
            python-version: '3.10'
          - runner: windows-latest
            python-version: '3.14'
          - runner: ubuntu-24.04-arm
            python-version: '3.14'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - if: runner.os == 'Linux'
        run: python -m pip install -r assets/payload/packages/monitor_runtime/requirements.txt
      - run: go test ./...
      - run: python tooling/checks/output_contract_audit.py
      - run: python -m unittest discover -s assets/payload/packages/agent-workspace-template/source/tests -v
      - if: runner.os == 'Linux'
        env:
          PYTHONPATH: assets/payload
        run: python -m unittest discover -s assets/payload/packages/others/tests -v
      - if: runner.os == 'Linux'
        env:
          PYTHONPATH: assets/payload/packages/monitor_runtime
        run: python -m unittest discover -s assets/payload/packages/monitor_runtime/tests -v
      - name: Test NVIDIA stress runtime without CUDA dependencies
        env:
          PYTHONPATH: assets/payload/packages/stress_gpu_runtime
        run: python -m unittest discover -s assets/payload/packages/stress_gpu_runtime/tests -v
      - run: python -m compileall -q assets/payload/packages/stress_gpu_runtime
      - run: python -m compileall -q assets/payload/packages/others
      - run: python -m compileall -q assets/payload/packages/monitor_runtime/monitor_runtime assets/payload/packages/monitor_runtime/tests
      - if: runner.os == 'Linux' && runner.arch == 'X64' && matrix.python-version == '3.14'
        run: go test -race ./...
      - run: go build -o "${{ runner.temp }}/tb" ./cmd/tb
      - if: runner.os == 'Linux'
        run: find assets/payload/packages/scripts -type f -name '*.sh' -exec bash -n {} +
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PowerShellFiles = @(
            Get-ChildItem assets/payload/packages/scripts -Recurse -Filter *.ps1
            Get-Item install.ps1, assets/payload/completions/tb.ps1, tooling/local-install/install_test.ps1, tooling/checks/completion_test.ps1, tooling/checks/terminal-hotkey_test.ps1, tooling/checks/wsl-shift-enter_test.ps1, tooling/reader/build-markdown-reader.ps1, tooling/reader/build-markdown-reader-checks.ps1, tooling/reader/build-markdown-reader_test.ps1, tooling/checks/windows-prompt_test.ps1
          )
          $PowerShellFiles | ForEach-Object {
            $Errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$Errors)
            if ($Errors.Count -gt 0) {
              throw "PowerShell syntax error in $($_.FullName): $Errors"
            }
          }
          & ./tooling/checks/completion_test.ps1
          & ./tooling/local-install/install_test.ps1
          & ./tooling/checks/terminal-hotkey_test.ps1
          & ./tooling/checks/wsl-shift-enter_test.ps1
          & ./tooling/reader/build-markdown-reader_test.ps1
          & ./tooling/checks/windows-prompt_test.ps1
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($Path in @('install.ps1', 'assets/payload/completions/tb.ps1', 'tooling/local-install/install_test.ps1', 'tooling/checks/completion_test.ps1', 'tooling/checks/terminal-hotkey_test.ps1', 'tooling/checks/wsl-shift-enter_test.ps1', 'tooling/reader/build-markdown-reader.ps1', 'tooling/reader/build-markdown-reader-checks.ps1', 'tooling/reader/build-markdown-reader_test.ps1', 'tooling/checks/windows-prompt_test.ps1')) {
            $Errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $Path), [ref]$null, [ref]$Errors)
            if ($Errors.Count -gt 0) {
              throw "Windows PowerShell syntax error in ${Path}: $Errors"
            }
          }
          & ./tooling/checks/completion_test.ps1
          & ./tooling/local-install/install_test.ps1
          & ./tooling/checks/terminal-hotkey_test.ps1
          & ./tooling/checks/wsl-shift-enter_test.ps1
          & ./tooling/reader/build-markdown-reader_test.ps1
          & ./tooling/checks/windows-prompt_test.ps1

  python2-syntax:
    runs-on: ubuntu-latest
    container: python:2.7-buster
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: pip install -r assets/payload/packages/agent-workspace-template/source/scripts/linux/python2/requirements.txt
      - run: python assets/payload/packages/agent-workspace-template/source/tests/python2_toolbox_adapter_test.py

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Zsh
        run: |
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -Fq 'dl.google.com/linux/chrome' "$source"; then
              sudo rm -f "$source"
            fi
          done
          sudo apt-get update && sudo apt-get install -y zsh
      - run: sh tooling/release/next-release-version_test.sh
      - run: sh tooling/release/build-release_test.sh
      - run: sh tooling/reader/build-markdown-reader_test.sh
      - run: sh tooling/local-install/install_test.sh
      - run: sh tooling/checks/completion_test.sh
      - run: sh tooling/checks/cronjob_test.sh
      - run: shellcheck assets/payload/packages/macros/cronjob/codex_hi.sh tooling/checks/cronjob_test.sh
      - run: bash tooling/checks/terminal-setup_test.sh
      - run: bash tooling/checks/toggle-nopasswd-sudo_test.sh
      - run: bash tooling/checks/desktop-utils_test.sh
      - run: bash tooling/checks/gpu-isolation_test.sh
      - run: python3 tooling/checks/mount_drive_test.py
      - run: bash -n assets/payload/completions/tb.bash
      - run: zsh -n assets/payload/completions/_tb
      - run: shellcheck install.sh assets/payload/completions/tb.bash assets/payload/packages/scripts/utils/isolate_gpu.sh assets/payload/packages/scripts/utils/toggle_nopasswd_sudo.sh tooling/release/build-release.sh tooling/release/build-release_test.sh tooling/reader/build-markdown-reader.sh tooling/reader/build-markdown-reader_test.sh tooling/checks/completion_test.sh tooling/checks/gpu-isolation_test.sh tooling/local-install/install_test.sh tooling/checks/terminal-setup_test.sh tooling/checks/toggle-nopasswd-sudo_test.sh tooling/testdata/go tooling/testdata/reader tooling/testdata/reader-build/cargo tooling/testdata/reader-build/readelf
