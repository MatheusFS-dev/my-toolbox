name: Dispatch release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TOOLBOX_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$TOOLBOX_SHA" != "$MAIN_SHA" ]; then
            printf 'Skipping superseded commit %s; main is %s.\n' "$TOOLBOX_SHA" "$MAIN_SHA"
            exit 0
          fi
          if gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].target_commitish' | grep -Fx "$TOOLBOX_SHA"; then
            printf 'Commit %s already has a release; skipping automatic dispatch.\n' "$TOOLBOX_SHA"
            exit 0
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f toolbox_sha="$TOOLBOX_SHA"
