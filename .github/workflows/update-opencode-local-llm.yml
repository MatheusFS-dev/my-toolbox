name: Update local LLM package

on:
  repository_dispatch:
    types: [opencode-local-llm-updated]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0
      - name: Validate and update exact submodule commit
        env:
          PACKAGE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          case "$PACKAGE_SHA" in
            *[!0-9a-f]*|'') printf 'Invalid local LLM package SHA.\n' >&2; exit 1 ;;
          esac
          test "${#PACKAGE_SHA}" -eq 40
          package=assets/payload/packages/opencode_local_llm
          git -C "$package" fetch origin main "$PACKAGE_SHA"
          git -C "$package" cat-file -e "$PACKAGE_SHA^{commit}"
          git -C "$package" merge-base --is-ancestor "$PACKAGE_SHA" origin/main
          current=$(git -C "$package" rev-parse HEAD)
          if [ "$current" = "$PACKAGE_SHA" ]; then
            printf 'Local LLM package is already pinned to %s; no update required.\n' "$PACKAGE_SHA"
            exit 0
          fi
          git -C "$package" checkout --detach "$PACKAGE_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$package"
          git commit -m "chore: update local LLM package to $PACKAGE_SHA"
          git push origin HEAD:main
