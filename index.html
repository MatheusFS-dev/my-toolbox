<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>my-toolbox</title>
  <meta name="description" content="A portable terminal toolbox for installing CLI agents, base tools, plugins, and agent workspace templates.">
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
    }

    body {
      margin: 0 auto;
      max-width: 52rem;
      padding: 4rem 1.5rem;
    }

    h1 {
      margin-bottom: 0.5rem;
    }

    h2 {
      margin-top: 2rem;
    }

    pre {
      overflow-x: auto;
      padding: 1rem;
      border: 1px solid currentColor;
      border-radius: 0.5rem;
    }

    a {
      color: inherit;
    }
  </style>
</head>
<body>
  <main>
    <h1>my-toolbox</h1>
    <p>A portable terminal toolbox for Linux x64, Linux ARM64, and Windows x64.</p>

    <h2>Linux</h2>
    <pre><code>curl -fsSL https://matheusfs-dev.github.io/my-toolbox/install.sh | sh</code></pre>

    <h2>Windows PowerShell</h2>
    <pre><code>irm https://matheusfs-dev.github.io/my-toolbox/install.ps1 | iex</code></pre>

    <p><a href="https://github.com/MatheusFS-dev/my-toolbox">Source code and documentation on GitHub</a></p>
  </main>
</body>
</html>
